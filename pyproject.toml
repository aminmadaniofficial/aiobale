[project]
name = "aiobale-py"
version = "0.3.8"
description = "Modern, fast, fully asynchronous Python framework for Bale Messenger."
authors = [
    { name = "Amin Madani", email = "aminmadani112@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.9,<4.0",
    "aiofiles>=23.1,<24.0",
    "colorama>=0.4.6,<1.0",
    "pydantic>=2.0,<3.0",
    "typing_extensions>=4.0,<5.0",
    "blackboxprotobuf>=1.0.1,<2.0",
    "magic-filter>=1.0,<2.0"
]

[project.scripts]
aiobale = "aiobale.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/aminmadaniofficial/aiobale"
"Repository" = "https://github.com/aminmadaniofficial/aiobale"
"Documentation" = "https://aminmadaniofficial.github.io/aiobale/"
"PyPI" = "https://pypi.org/project/aiobale-py/"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
